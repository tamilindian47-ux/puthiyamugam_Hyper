name: Build PuthiyaMugam image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: puthiyamugam-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Define image name
        id: image
        shell: bash
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Reject private Runpod base image
        shell: bash
        run: |
          if grep -Eiq \
            '^[[:space:]]*FROM[[:space:]].*registry\.runpod\.net' \
            Dockerfile; then
            echo "::error::Restore the public NVIDIA-base Dockerfile first."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:multi-v1
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Display deployment image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          {
            echo "## Image ready"
            echo
            echo "Deploy this image on Runpod:"
            echo
            echo "\`${IMAGE}:${GITHUB_SHA}\`"
            echo
            echo "Make the package public, or configure private-registry credentials."
          } >> "$GITHUB_STEP_SUMMARY"
